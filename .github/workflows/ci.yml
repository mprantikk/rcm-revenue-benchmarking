name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rcm_benchmarking
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: rcm_benchmarking

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load schema and seed data
        run: |
          mysql -h 127.0.0.1 -uroot -proot rcm_benchmarking < schema.sql
          mysql -h 127.0.0.1 -uroot -proot rcm_benchmarking < seed_data.sql

      - name: Run tests
        run: pytest -v

      - name: Run benchmarking report
        run: python rcm_benchmarking.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: rcm-reports
          path: output/*.csv
